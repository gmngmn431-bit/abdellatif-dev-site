name: sitemap

on:
  schedule:
    - cron: '0 3 * * 0'   # تشغيل أسبوعي كل أحد الساعة 03:00 UTC
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-sitemap.mjs'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:       # تشغيل يدوي اختياري من تبويب Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sitemap generator
        run: node scripts/generate-sitemap.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes in sitemap.xml to commit."
          else
            git commit -m "chore: regenerate sitemap.xml [skip ci]"
            git push
          fi